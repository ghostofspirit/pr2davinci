name: Build and publish PR2DAVINCI V2 Linux release

on:
  push:
    tags:
      - "v2.*"

permissions:
  contents: write

jobs:
  flatpak:
    name: Build Linux Flatpak
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged V2 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install Flatpak build tools and runtimes
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --noninteractive --assumeyes flathub \
            org.kde.Sdk//6.11 io.qt.PySide.BaseApp//6.11

      - name: Build Flatpak bundle
        run: |
          flatpak-builder --force-clean --repo=flatpak-repo build-dir flatpak/com.serotoninja.PremiereToResolve.yml
          test -x build-dir/files/bin/premiere-to-resolve
          test -x build-dir/files/bin/premiere-to-resolve-drp
          asset="PR2DAVINCI-${GITHUB_REF_NAME}-linux-x86_64.flatpak"
          # flatpak-builder defaults to the "master" branch unless configured otherwise.
          # The release tag names the asset, not the OSTree ref inside the bundle.
          flatpak build-bundle flatpak-repo "$asset" com.serotoninja.PremiereToResolve master
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: Linux-x86_64
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 2

  rpm:
    name: Build Fedora 44 RPM
    runs-on: ubuntu-24.04
    container: registry.fedoraproject.org/fedora:44
    steps:
      - name: Check out tagged V2 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Install RPM build dependencies
        run: dnf install -y rpm-build python3-pip python3-pyside6 python3-zstandard gzip curl-minimal coreutils tar

      - name: Build RPM
        run: |
          set -euxo pipefail
          top="$GITHUB_WORKSPACE/rpmbuild"
          mkdir -p "$top"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS} release-assets
          cp packaging/rpm/premiere-to-resolve.spec "$top/SPECS/"
          tar --directory="$GITHUB_WORKSPACE" \
            --exclude='./.git' --exclude='./rpmbuild' --exclude='./release-assets' \
            --transform='s,^[.]/,premiere-to-resolve-2.0.0/,' \
            -czf "$top/SOURCES/premiere-to-resolve-2.0.0.tar.gz" .
          wheel="$top/SOURCES/py_premiere-0.1.0-py3-none-any.whl"
          curl -fsSL \
            https://files.pythonhosted.org/packages/9c/47/274fbe4dbfad990ac9170792600b0a88c89abc60e73583ec4955a3a9197d/py_premiere-0.1.0-py3-none-any.whl \
            -o "$wheel"
          echo '955c9ddb30800e0bf6c0b03fb2b3752b52a295a9a84af7ec76ecd89b0cf0ecd1  '"$wheel" | sha256sum --check
          rpmbuild -bb --define "_topdir $top" \
            "$top/SPECS/premiere-to-resolve.spec"
          cp "$top"/RPMS/noarch/*.rpm release-assets/

      - name: Upload Fedora RPM
        uses: actions/upload-artifact@v4
        with:
          name: Fedora-44-RPM
          path: release-assets/*.rpm
          if-no-files-found: error
          retention-days: 2

  windows:
    name: Build Windows x86_64 app
    runs-on: windows-latest
    steps:
      - name: Check out tagged V2 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build desktop app
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
          pyinstaller --noconfirm --clean --windowed --name PR2DAVINCI `
            --collect-data premiere_to_resolve --collect-all py_premiere --collect-all zstandard `
            --add-data "premiere_to_resolve/resolve_api_worker.py;premiere_to_resolve" `
            --add-data "premiere_to_resolve/offline_media.py;premiere_to_resolve" `
            launch_gui.py
          if (!(Test-Path "dist/PR2DAVINCI/PR2DAVINCI.exe")) { throw "Windows app executable was not created" }
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $asset = "PR2DAVINCI-$env:GITHUB_REF_NAME-windows-x86_64.zip"
          Compress-Archive -Path dist/PR2DAVINCI -DestinationPath "release-assets/$asset"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Windows-x86_64
          path: release-assets/*.zip
          if-no-files-found: error
          retention-days: 2

  macos:
    name: Build macOS ${{ matrix.arch }} app
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - name: Check out tagged V2 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build desktop app
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
          pyinstaller --noconfirm --clean --windowed --name PR2DAVINCI \
            --collect-data premiere_to_resolve --collect-all py_premiere --collect-all zstandard \
            --add-data 'premiere_to_resolve/resolve_api_worker.py:premiere_to_resolve' \
            --add-data 'premiere_to_resolve/offline_media.py:premiere_to_resolve' \
            launch_gui.py
          test -d dist/PR2DAVINCI.app
          mkdir -p release-assets
          asset="PR2DAVINCI-${GITHUB_REF_NAME}-macos-${{ matrix.arch }}.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/PR2DAVINCI.app "release-assets/$asset"

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: macOS-${{ matrix.arch }}
          path: release-assets/*.zip
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Publish V2 desktop release
    needs: [flatpak, rpm, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download Flatpak bundle
        uses: actions/download-artifact@v4
        with:
          name: Linux-x86_64
          path: release-assets

      - name: Download Fedora RPM
        uses: actions/download-artifact@v4
        with:
          name: Fedora-44-RPM
          path: release-assets

      - name: Download Windows app
        uses: actions/download-artifact@v4
        with:
          name: Windows-x86_64
          path: release-assets

      - name: Download macOS Apple Silicon app
        uses: actions/download-artifact@v4
        with:
          name: macOS-arm64
          path: release-assets

      - name: Download macOS Intel app
        uses: actions/download-artifact@v4
        with:
          name: macOS-x86_64
          path: release-assets

      - name: Create release and attach Linux packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          # PR2DAVINCI 2.0.0

          **English:** PR2DAVINCI 2.0.0 converts a native Premiere Pro project into a DaVinci Resolve DRP. The archive includes project timelines and bins; offline media can be relinked in Resolve. The release has been opened and checked in Resolve.

          **Русский:** PR2DAVINCI 2.0.0 преобразует проект Premiere Pro в DRP DaVinci Resolve. В архив входят секвенции и папки проекта; офлайн-медиа можно перелинковать в Resolve. Релиз проверен открытием в Resolve.

          Linux packages: Flatpak for x86_64 and RPM for Fedora 44. Desktop app bundles are also available for Windows x86_64 and macOS arm64 and x86_64. All app bundles are unsigned; macOS may require Control-click → Open on first launch.
          EOF
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "PR2DAVINCI 2.0.0" \
              --notes-file release-notes.md
          fi
